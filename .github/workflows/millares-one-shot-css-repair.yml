name: MILLARES one-shot CSS repair

on:
  push:
    paths:
      - .github/workflows/millares-one-shot-css-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/millares-house-v1-2026-08-10
          fetch-depth: 0

      - name: Repair launch CSS
        shell: python
        run: |
          from pathlib import Path

          path = Path('styles.css')
          css = path.read_text(encoding='utf-8')
          css = css.replace('from { filter: brightness(.78); opacity: calc(var(--o) * .72); }', 'from { filter: brightness(.78); }')
          css = css.replace('.evolving-field { inset-left: 38%; opacity: .58; }', '.evolving-field { left: 38%; opacity: .58; }')
          path.write_text(css, encoding='utf-8')

          Path('.github/workflows/millares-one-shot-css-repair.yml').unlink()

      - name: Commit repair and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css .github/workflows/millares-one-shot-css-repair.yml
          git commit -m "fix: repair MILLARES responsive field CSS"
          git push origin HEAD:launch/millares-house-v1-2026-08-10
